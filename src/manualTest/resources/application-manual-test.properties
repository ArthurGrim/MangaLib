# Keine Imports und kein produktiver Fallback. Nur der separate Launcher lädt diese Datei.
spring.profiles.active=manual-test
spring.config.location=classpath:/application-manual-test.properties
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/mangalib_manual_test?useSSL=false
spring.datasource.username=mangalib_manual_test_user
spring.datasource.password=${MANGALIB_MANUAL_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false
spring.main.allow-bean-definition-overriding=false
spring.main.allow-circular-references=false
spring.main.banner-mode=off
spring.http.converters.preferred-json-mapper=jackson
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
server.address=127.0.0.1
server.port=18080
server.forward-headers-strategy=none
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=2m
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
management.endpoints.web.discovery.enabled=false
