spring.datasource.url=jdbc:mysql://localhost:3306/mangalib?useSSL=false
spring.datasource.username=mangalib_user
spring.datasource.password=${MANGALIB_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.http.converters.preferred-json-mapper=jackson
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Lokale Einzelbenutzeranwendung: kein Proxy, LAN oder separater Management-Port.
server.address=127.0.0.1
server.port=8080
server.forward-headers-strategy=none
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
management.endpoints.web.discovery.enabled=false
